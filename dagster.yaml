# Instance Dagster partagée par le webserver, le démon et le serveur de code.
storage:
  postgres:
    postgres_db:
      hostname: { env: DAGSTER_PG_HOST }
      username: { env: DAGSTER_PG_USER }
      password: { env: DAGSTER_PG_PASSWORD }
      db_name: { env: DAGSTER_PG_DB }
      port: 5432

# Les runs sont lancés par le serveur de code, dans son conteneur (accès au volume /data).
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 2

# Volume partagé entre conteneurs : le webserver affiche les stdout/stderr écrits par les runs.
local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/storage

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/storage/compute_logs

telemetry:
  enabled: false
