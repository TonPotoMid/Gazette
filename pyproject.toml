[project]
name = "gazette"
version = "0.1.0"
requires-python = ">=3.11"

[tool.dagster]
module_name = "gazette.definitions"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
